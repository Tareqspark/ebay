name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # next build never queries the DB (no generateStaticParams / static
      # data fetching, per CLAUDE.md) and the test suite only covers pure
      # logic — this placeholder just needs to be a well-formed URI so
      # mysql2's connection pool can construct itself; it never connects.
      DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
      AUTH_SECRET: "ci-placeholder-secret-not-for-production"
      AUTH_URL: "http://localhost:3000"
      STRIPE_SECRET_KEY: ""
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ""
      STRIPE_WEBHOOK_SECRET: ""
      SENDGRID_API_KEY: ""
      SENDGRID_FROM_EMAIL: ""
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
